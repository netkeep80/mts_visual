name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate standalone governance boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { access, readFile } from "node:fs/promises";

          const expectedRepoGuard = "921582f085b0dffab22d847889893cda70fc3f2b";
          const required = [
            "repo-policy.json",
            ".github/workflows/ci.yml",
            ".github/workflows/repo-guard.yml",
            ".github/PULL_REQUEST_TEMPLATE.md",
          ];
          for (const path of required) await access(path);

          const policy = JSON.parse(await readFile("repo-policy.json", "utf8"));
          if (policy.policy_format_version !== "0.3.0") throw new Error("policy format must be 0.3.0");
          if (policy.repository_kind !== "tooling") throw new Error("repository kind must be tooling");
          if (policy.enforcement?.mode !== "blocking") throw new Error("repo-policy must be blocking");

          const integrations = policy.integration?.workflows ?? [];
          const ci = integrations.find((entry) => entry.id === "project-ci");
          if (ci?.role !== "ci_gate" || ci?.expect?.enforcement !== "blocking") {
            throw new Error("blocking project-ci integration is missing");
          }
          const guardIntegration = integrations.find((entry) => entry.id === "repo-guard-pr");
          if (guardIntegration?.role !== "repo_guard_pr_gate") {
            throw new Error("repo-guard-pr integration is missing");
          }
          if (guardIntegration?.expect?.action?.uses !== "netkeep80/repo-guard") {
            throw new Error("repo-guard action owner mismatch");
          }
          if (guardIntegration?.expect?.action?.ref !== expectedRepoGuard) {
            throw new Error("repo-guard integration must pin exact expected SHA");
          }
          if (guardIntegration?.expect?.action?.ref_pinning !== "sha") {
            throw new Error("repo-guard integration must require SHA pinning");
          }

          const templates = policy.integration?.templates ?? [];
          const prTemplate = templates.find((entry) => entry.id === "pull-request-change-intent");
          if (prTemplate?.requires_change_intent_block !== true || prTemplate?.required_block_kind !== "repo-guard-yaml") {
            throw new Error("ChangeIntent PR template integration is missing");
          }

          const guardWorkflow = await readFile(".github/workflows/repo-guard.yml", "utf8");
          if (!guardWorkflow.includes(`netkeep80/repo-guard@${expectedRepoGuard}`)) {
            throw new Error("repo-guard workflow is not pinned to exact expected SHA");
          }
          if (/netkeep80\/repo-guard@(main|latest)\b/.test(guardWorkflow)) {
            throw new Error("floating repo-guard ref is forbidden");
          }
          NODE

  standalone-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install exact standalone dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate package ownership boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          if (pkg.name !== "@mts/visual") throw new Error("package name must be @mts/visual");
          if (pkg.version !== "0.1.0") throw new Error("standalone extraction baseline must be 0.1.0");
          if (pkg.private !== true) throw new Error("standalone extraction baseline must remain private");
          if (pkg.dependencies?.three !== "0.185.1") throw new Error("three must remain exact 0.185.1");
          if (pkg.devDependencies?.["@types/three"] !== "0.185.0") throw new Error("@types/three must remain exact 0.185.0");
          if (pkg.devDependencies?.typescript !== "5.9.3") throw new Error("typescript must be exact 5.9.3");

          const allDependencies = {
            ...(pkg.dependencies ?? {}),
            ...(pkg.devDependencies ?? {}),
            ...(pkg.peerDependencies ?? {}),
            ...(pkg.optionalDependencies ?? {}),
          };
          for (const forbidden of ["@mts/core", "anum_docs", "anum_parser", "aprover"]) {
            if (forbidden in allDependencies) throw new Error(`forbidden dependency authority: ${forbidden}`);
          }

          const root = await readFile("src/index.ts", "utf8");
          if (/\.\/three|from\s+["']three["']/.test(root)) {
            throw new Error("browser-neutral root must not re-export or import Three companion APIs");
          }
          NODE
      - name: Reject cross-repository semantic authority imports
        shell: bash
        run: |
          if grep -R -n -E '@mts/core|netkeep80/anum_docs|netkeep80/anum_parser|netkeep80/aprover' src test package.json tsconfig.json; then
            echo "::error::standalone visual package contains forbidden semantic/repository authority reference"
            exit 1
          fi
      - name: Build and run accepted visual conformance suite
        run: npm run check
