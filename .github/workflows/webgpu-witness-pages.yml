name: WebGPU witness Pages

on:
  pull_request:
    paths:
      - "browser/webgpu-witness/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/webgpu-witness-pages.yml"
  push:
    branches: [main]
    paths:
      - "browser/webgpu-witness/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/webgpu-witness-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgpu-witness-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run accepted package suite
        run: npm run check

      - name: Bundle exact checkout for browser witness
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/vendor

          cp browser/webgpu-witness/index.html _site/index.html
          cp browser/webgpu-witness/app.js _site/app.js
          cp browser/webgpu-witness/benchmark.js _site/benchmark.js
          touch _site/.nojekyll

          npx --yes esbuild@0.24.2             src/index.ts             --bundle             --format=esm             --platform=browser             --target=es2022             --outfile=_site/vendor/mts-visual-core.bundle.js

          npx --yes esbuild@0.24.2             src/webgpu/index.ts             --bundle             --format=esm             --platform=browser             --target=es2022             --outfile=_site/vendor/mts-visual-webgpu.bundle.js

          npx --yes esbuild@0.24.2             src/three/index.ts             --bundle             --format=esm             --platform=browser             --target=es2022             --outfile=_site/vendor/mts-visual-three.bundle.js

          test -s _site/vendor/mts-visual-core.bundle.js
          test -s _site/vendor/mts-visual-webgpu.bundle.js
          test -s _site/vendor/mts-visual-three.bundle.js

      - name: Generate exact build identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const info = {
            schemaVersion: 1,
            version: pkg.version,
            mainSha: process.env.BUILD_SHA,
            builtAt: new Date().toISOString(),
            labSelfTestContract: "five-mode-resource-cycle/v1",
          };
          await writeFile("_site/build-info.json", JSON.stringify(info, null, 2) + "\n");
          console.log(info);
          NODE

      - name: Verify static witness payload
        run: |
          set -euo pipefail
          node --check browser/webgpu-witness/app.js
          node --check browser/webgpu-witness/benchmark.js
          test -s _site/benchmark.js

          grep -F 'src="./app.js"' _site/index.html
          grep -F 'from "./benchmark.js"' _site/app.js
          grep -F 'queue.onSubmittedWorkDone()' _site/benchmark.js
          grep -F 'createMonolithicLinkWebGpuComputeFromTopology3D' _site/benchmark.js
          grep -F './vendor/mts-visual-core.bundle.js' _site/app.js
          grep -F './vendor/mts-visual-webgpu.bundle.js' _site/app.js
          grep -F './vendor/mts-visual-three.bundle.js' _site/app.js
          grep -F 'runOctahedralWebGpuDifferentialWitness3D' _site/app.js
          grep -F 'createOctahedralWebGpuZeroCopyRenderer3D' _site/app.js
          grep -F 'renderer.positionBuffer === compute.positionBuffer' _site/app.js
          grep -F 'id="lab-run-cycle-test"' _site/index.html
          grep -F 'id="lab-resource-audit"' _site/index.html
          grep -F 'LAB_SELF_TEST_CONTRACT = "five-mode-resource-cycle/v1"' _site/app.js
          grep -F 'LAB_SELF_TEST_QUERY = "mode-cycle"' _site/app.js
          grep -F 'runLabModeCycleSelfTest' _site/app.js

          cp _site/vendor/mts-visual-core.bundle.js /tmp/mts-visual-core.bundle.mjs
          cp _site/vendor/mts-visual-webgpu.bundle.js /tmp/mts-visual-webgpu.bundle.mjs
          cp _site/vendor/mts-visual-three.bundle.js /tmp/mts-visual-three.bundle.mjs

          node --input-type=module <<'NODE'
          const core = await import("file:///tmp/mts-visual-core.bundle.mjs");
          const gpu = await import("file:///tmp/mts-visual-webgpu.bundle.mjs");
          const threeVisual = await import("file:///tmp/mts-visual-three.bundle.mjs");

          if (core.OCTAHEDRAL_PRESENTATION_BASELINE_OCTAHEDRA !== 20) {
            throw new Error("browser bundle lost 20-octahedron presentation baseline");
          }
          if (!(core.OCTAHEDRAL_PRESENTATION_BASELINE_ASPECT_RATIO > 14
             && core.OCTAHEDRAL_PRESENTATION_BASELINE_ASPECT_RATIO < 15)) {
            throw new Error("browser bundle has unexpected capless presentation aspect ratio");
          }
          for (const name of [
            "createOctahedralWebGpuCompute3D",
            "runOctahedralWebGpuDifferentialWitness3D",
            "createOctahedralWebGpuZeroCopyRenderer3D",
          ]) {
            if (typeof gpu[name] !== "function") throw new Error(`missing WebGPU export: ${name}`);
          }
          for (const name of [
            "createVisualThreeLiveRenderer",
            "destroyVisualThreeRenderer",
            "fitVisualThreeRenderer",
            "setVisualThreeLivePaused",
          ]) {
            if (typeof threeVisual[name] !== "function") throw new Error(`missing Three export: ${name}`);
          }
          NODE

          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const info = JSON.parse(await readFile("_site/build-info.json", "utf8"));
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          if (info.version !== pkg.version) throw new Error("build-info package version mismatch");
          if (!/^[0-9a-f]{40}$/.test(info.mainSha)) throw new Error("build-info SHA is not exact");
          if (info.labSelfTestContract !== "five-mode-resource-cycle/v1") {
            throw new Error("build-info laboratory self-test contract mismatch");
          }
          NODE

      - name: Upload build artifact for PR diagnostics
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mts-visual-webgpu-witness
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy witness to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed exact build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          mkdir -p /tmp/mts-visual-pages-smoke

          fetch() {
            local path="$1"
            local target="$2"
            curl               --fail --location --silent --show-error               --retry 12 --retry-delay 5 --retry-all-errors               -H 'Cache-Control: no-cache'               "${base}${path}?smoke=${EXPECTED_SHA}"               -o "${target}"
            test -s "${target}"
          }

          fetch "build-info.json" /tmp/mts-visual-pages-smoke/build-info.json
          fetch "index.html" /tmp/mts-visual-pages-smoke/index.html
          fetch "app.js" /tmp/mts-visual-pages-smoke/app.js
          fetch "vendor/mts-visual-core.bundle.js" /tmp/mts-visual-pages-smoke/core.js
          fetch "vendor/mts-visual-webgpu.bundle.js" /tmp/mts-visual-pages-smoke/webgpu.js
          fetch "vendor/mts-visual-three.bundle.js" /tmp/mts-visual-pages-smoke/three.js

          jq -e --arg sha "${EXPECTED_SHA}" '.mainSha == $sha'             /tmp/mts-visual-pages-smoke/build-info.json >/dev/null
          jq -e '.labSelfTestContract == "five-mode-resource-cycle/v1"'             /tmp/mts-visual-pages-smoke/build-info.json >/dev/null
          grep -F '<html lang="ru">' /tmp/mts-visual-pages-smoke/index.html
          grep -F 'id="gpu-canvas"' /tmp/mts-visual-pages-smoke/index.html
          grep -F 'id="lab-run-cycle-test"' /tmp/mts-visual-pages-smoke/index.html
          grep -F 'id="lab-resource-audit"' /tmp/mts-visual-pages-smoke/index.html
          grep -F 'runOctahedralWebGpuDifferentialWitness3D' /tmp/mts-visual-pages-smoke/app.js
          grep -F 'createOctahedralWebGpuZeroCopyRenderer3D' /tmp/mts-visual-pages-smoke/app.js
          grep -F 'LAB_SELF_TEST_CONTRACT = "five-mode-resource-cycle/v1"' /tmp/mts-visual-pages-smoke/app.js
          grep -F 'LAB_SELF_TEST_QUERY = "mode-cycle"' /tmp/mts-visual-pages-smoke/app.js
          grep -F 'runLabModeCycleSelfTest' /tmp/mts-visual-pages-smoke/app.js

          echo "Published WebGPU witness PASS: ${base}"
          echo "Browser self-test entrypoint: ${base}?selftest=mode-cycle"
